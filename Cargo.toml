[package]
name = "camera-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "webcam viewer with lens effects and camera control"

[[bin]]
name = "camera-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.37"
wgpu = "30"
v4l = "0.14"
zune-jpeg = "0.5"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
